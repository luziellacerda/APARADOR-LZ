name: Compilar e publicar Windows offline

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'ci/**'
      - 'src/**'
      - 'installer/**'
      - 'assets/**'
      - 'Build-*.ps1'
      - 'Test-PackagedMedia.ps1'
      - 'tests/**'
      - 'docs/*.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    name: Compilar FFmpeg, x264 e x265
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache dos componentes e fontes correspondentes
        id: cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ci-out
          key: ffmpeg-win64-v1-${{ hashFiles('ci/Build-FFmpeg.sh', 'ci/dependencies.lock.json', 'ci/patches/**', 'ci/licenses/**') }}
      - name: Preparar compiladores
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64-win32 g++-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev nasm cmake ninja-build make pkg-config curl xz-utils jq patch
      - name: Compilar componentes a partir dos fontes fixados
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/Build-FFmpeg.sh
      - name: Disponibilizar componentes para o teste Windows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: componentes-offline
          path: ci-out/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    name: Compilar EXE, testar e gerar instalador
    needs: dependencies
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: componentes-offline
          path: ci-out
      - name: Verificar plataforma e versao da release
        run: |
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or -not [Environment]::Is64BitProcess) { throw 'Requer Windows PowerShell 5.1 x64.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne 'v1.5.0') { throw 'A tag deve corresponder a versao 1.5.0 do codigo.' }
          $nsis = 'C:\Program Files (x86)\NSIS\makensis.exe'
          $version = (& $nsis /VERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'v3.10') { throw ('Revisar toolchain NSIS: '+$version) }
          $dependencySums = @(Get-Content -LiteralPath .\ci-out\SHA256SUMS.txt)
          if ($dependencySums.Count -ne 3) { throw 'Manifesto de dependencias incompleto.' }
          foreach ($line in $dependencySums) {
            if ($line -notmatch '^([a-f0-9]{64})  (bin/ffmpeg\.exe|bin/ffprobe\.exe|sources/FFmpeg-corresponding-source\.tar\.xz)$') { throw 'Entrada de hash inesperada.' }
            if ((Get-FileHash -LiteralPath (Join-Path .\ci-out $Matches[2])).Hash -ne $Matches[1]) { throw 'Dependencia com hash incorreto.' }
          }
          & .\ci-out\bin\ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg nao abriu no Windows.' }
          & .\ci-out\bin\ffprobe.exe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe nao abriu no Windows.' }
      - name: Compilar EXE e instaladores
        run: |
          .\Build-Installer.ps1 -OutputRoot .\builds\ci -FfmpegDirectory .\ci-out\bin -FfmpegNoticePath .\ci-out\docs\TERCEIROS-FFMPEG.txt -NsisNoticePath 'C:\Program Files (x86)\NSIS\COPYING' -IncludeTestBuild
      - name: Testar recorte, audio, subpastas e todos os perfis
        timeout-minutes: 8
        run: .\Test-PackagedMedia.ps1 -AppRoot .\builds\ci\app -AllProfiles
      - name: Testar layout, menus e campos do Video Studio
        run: .\tests\Test-PremiumUI.ps1 -AppRoot .\builds\ci\app -OutputDirectory .\builds\ci\ui
      - name: Testar instalacao, reinstalacao e desinstalacao
        timeout-minutes: 8
        run: |
          $setup = (Resolve-Path '.\builds\ci\LZGames-Aparador-1.5.0-TESTE-Setup.exe').Path
          .\tests\Test-Installer.ps1 -InstallerPath $setup -ExpectedInstallerSha256 (Get-FileHash -LiteralPath $setup).Hash -PayloadRoot (Resolve-Path '.\builds\ci\app').Path
      - name: Preparar somente arquivos publicaveis
        run: |
          $media = @(Get-ChildItem .\media-tests -Filter result.json -Recurse -File)
          $installer = @(Get-ChildItem .\tests\runs -Filter installer-test-result.json -Recurse -File)
          if ($media.Count -ne 1 -or $installer.Count -ne 1) { throw 'Esperado exatamente um relatorio de cada bateria.' }
          .\ci\Prepare-Release.ps1 -BuildRoot .\builds\ci -DependencyRoot .\ci-out -OutputDirectory .\release-out -MediaReportPath $media[0].FullName -InstallerReportPath $installer[0].FullName -SourceCommit $env:GITHUB_SHA -Tag v1.5.0 -RunUrl "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
      - name: Salvar pacote validado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-offline
          path: release-out/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publicar release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-offline
          path: release-out
      - name: Criar release sem substituir arquivos existentes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-out/* --verify-tag --title "LZ Games ${RELEASE_TAG} — Video Studio offline" --notes "Interface minimalista: resumo em linha sem cartoes grandes, paineis sem molduras e transicoes curtas em botoes, abas e interruptores. Corrige artefatos de redesenho ao maximizar. Instalador completo offline compilado e testado pelo GitHub Actions. Baixe LZGames-Aparador-1.5.0-Setup.exe. Inclui FFmpeg, H.264 e H.265 compilados dos fontes fixados. Os fontes correspondentes, SHA256 e manifesto acompanham esta release. Requer Windows 10/11 x64, .NET Framework 4.8 e Windows PowerShell 5.1. Sem assinatura digital."
